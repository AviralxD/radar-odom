radom:
  ros__parameters:
    radar_topic: "/continental/points"
    imu_topic: "/imu/data_raw"
    # Each front-end publishes <output_namespace>/<name>/odom and .../stats.
    # They run side by side on identical input; the first listed owns the TF.
    output_namespace: "/radom"
    frontends: ["ransac", "gnc"]
    inlier_threshold_mps: 0.15   # RANSAC threshold and GNC noise bound
    gnc_mu_step: 1.4
    gnc_max_iterations: 100
    odom_frame: "odom"
    base_frame: "continental"
    publish_tf: true
    doppler_field: "v"
    rcs_field: "RCS"

    # Added to radar stamps to put them on the IMU clock [s].
    # Fitted on hercules_parking_04 only; re-check it on other sequences.
    radar_time_offset_s: -0.1
    # Radar velocity std floor in the radar frame [m/s]
    radar_vel_std: [0.10, 0.15, 0.20]
    nis_gate: 16.27
    max_consecutive_rejections: 20
